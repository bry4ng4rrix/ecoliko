services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Nom du service `redis` ci-dessous, résolu via le réseau interne de compose — remplace
      # toute valeur définie dans backend/.env (Redis externe non géré par ce compose).
      REDIS_URL: redis://redis:6379/1
    depends_on:
      - redis
    volumes:
      - backend_media:/app/media
      - backend_data:/app/data
    ports:
      - "8030:8000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8030/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  backend_media:
  backend_data:
  redis_data:
