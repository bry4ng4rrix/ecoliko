server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers hashés (Vite ajoute un hash au nom) : cache long possible sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA : toute route inconnue retombe sur index.html (react-router gère la navigation
    # côté client, y compris un rechargement direct sur /admin/etudiants par ex.).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
